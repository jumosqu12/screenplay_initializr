buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

plugins {
	id 'io.github.jumosqu12.screenplayarchitecture' version '1.1.2'
	id 'java'
    id 'eclipse'
    id 'idea'
}

group 'co.com.bancolombia.certificacion'

sourceCompatibility = 11

repositories {

    mavenCentral()
}

ext {
    serenityVersion = '4.1.0'
    serenityCucumberVersion = '4.1.0'
    lombokVersion = '1.18.22'
    junit = '4.13.2'
    hamcrest = '1.3'
    
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$rootProject.ext.serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$rootProject.ext.serenityCucumberVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation "net.serenity-bdd:serenity-screenplay-rest:$rootProject.ext.serenityVersion"

    //Test compilation
    testImplementation "junit:junit:$rootProject.ext.junit"
    testImplementation "org.hamcrest:hamcrest-all:$rootProject.ext.hamcrest"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    

    //Lombok dependencies
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly  "org.projectlombok:lombok:${lombokVersion}"

    //MySQL library
    implementation group: 'com.mysql', name: 'mysql-connector-j', version: '8.4.0'
    //postgresql library
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.3'
    //Oracle library
    implementation group: 'com.oracle.database.jdbc', name: 'ojdbc8', version: '23.2.0.0'
    //Sql Server library
    implementation group: 'com.microsoft.sqlserver', name: 'mssql-jdbc', version: '12.7.0'
    //AS400 library
    implementation group: 'net.sf.jt400', name: 'jt400', version: '20.0.6'
     //Additional library
    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'

}

tasks.named('test') {
    systemProperty 'PASSMSQL', System.getProperty('PASSMSQL')
    systemProperty 'PASSPSQL', System.getProperty('PASSPSQL')
    systemProperty 'PASSORACLE', System.getProperty('PASSORACLE')
    systemProperty 'PASSSQLS', System.getProperty('PASSSQLS')
    systemProperty 'PASSAS400', System.getProperty('PASSAS400')
    // System configs

}
